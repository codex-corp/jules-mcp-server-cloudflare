name: Temporary Cloudflare MCP validation

on:
  push:
    branches:
      - cloudflare-remote-mcp

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      # Node 22 runner npm 10.9.8 hit an Arborist edgesOut crash while
      # resolving this branch without a lockfile. Use the current npm 11
      # maintenance release to regenerate the lock deterministically once.
      - name: Ensure reproducible lockfile
        shell: bash
        run: |
          npm install --global npm@11.19.1
          npm --version
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f package-lock.json
            git commit -m "chore: restore package lock"
            git push
          fi

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run worker:typecheck
      - run: npm test
      - run: npx wrangler deploy --dry-run
